<title id="title">Follow Builders：来源名单、定位方式与获取解析路径</title>
<desc id="desc">26 个 X 账号通过 handle 和 API 获取动态；6 个播客通过 RSS 发现节目、pod2txt 获取转录，YouTube 匹配观看链接；2 个博客通过栏目地址获取正文。三路形成公开 feed，再由宿主 AI 整理。</desc>
<rect width="1600" height="1550" fill="#F5F6F2"/>
<style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif}a:hover text{text-decoration:underline}</style>
<text x="50" y="48" font-size="20" fill="#087B6A">FOLLOW BUILDERS  /  SOURCE MAP</text>
<text x="48" y="124" font-size="52" fill="#193039">来源名单 → 定位 → 获取与解析</text>
<text x="51" y="177" font-size="27" fill="#526970">34 个具体关注对象：26 个 X 账号、6 个播客节目、2 个博客栏目</text>
<rect x="50" y="207" width="1500" height="58" rx="12" fill="#E5ECE6" stroke="none" stroke-width="2"/>
<text x="71" y="244" font-size="22" fill="#087B6A">名单由作者在 default-sources.json 中集中设置；普通客户端读取采集后的公开 feed。</text>

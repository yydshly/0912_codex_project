<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
<title id="title">小智 ESP32：硬件、固件和 AI 后端</title><desc id="desc">设备内的麦克风、屏幕和喇叭由小智固件驱动。固件运行于 ESP32 主控，连接 AI 后端，后端理解和生成回答，工具调用让设备执行动作。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#497899"/></marker></defs>
<rect width="1200" height="520" fill="#f3f6fa"/><rect width="1200" height="92" fill="#102b44"/>
<g font-family="Microsoft YaHei,PingFang SC,sans-serif"><text x="38" y="43" fill="#83ccff" font-size="16">004 / XIAOZHI ESP32</text><text x="38" y="75" fill="#fff" font-size="26" font-weight="bold">硬件提供感知与动作，固件组织交互，后端提供 AI 能力</text>
<rect x="32" y="126" width="290" height="292" rx="8" fill="#fff" stroke="#cad9e6"/><text x="56" y="165" font-size="23" fill="#162a40" font-weight="bold">硬件：听、说、显示</text><text x="56" y="217" font-size="21" fill="#405a70">麦克风 → 音频输入</text><text x="56" y="261" font-size="21" fill="#405a70">功放＋喇叭 → 发声</text><text x="56" y="305" font-size="21" fill="#405a70">屏幕 → 字幕、表情</text><text x="56" y="367" font-size="18" fill="#60788c">按需外接相机、传感器、电机</text>
<rect x="422" y="126" width="356" height="292" rx="8" fill="#e3f0fc" stroke="#85b4d7"/><text x="446" y="165" font-size="23" fill="#005baf" font-weight="bold">小智固件：本仓库主体</text><text x="446" y="217" font-size="21" fill="#162a40">驱动硬件 · 音频编解码</text><text x="446" y="261" font-size="21" fill="#162a40">状态管理 · 协议通信</text><text x="446" y="305" font-size="21" fill="#162a40">MCP 工具 · 执行与返回</text><text x="446" y="367" font-size="18" fill="#405a70">运行在 ESP32 / RAM / Flash 上</text>
<rect x="878" y="126" width="290" height="292" rx="8" fill="#fff" stroke="#cad9e6"/><text x="902" y="165" font-size="23" fill="#162a40" font-weight="bold">兼容 AI 后端</text><text x="902" y="217" font-size="21" fill="#405a70">识别语音 · 理解请求</text><text x="902" y="261" font-size="21" fill="#405a70">生成回答 · 合成语音</text><text x="902" y="305" font-size="21" fill="#405a70">选择工具 · 连接业务</text><text x="902" y="367" font-size="18" fill="#60788c">官方服务或另行部署</text>
<path d="M330 265H414" fill="none" stroke="#497899" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)"/><text x="344" y="246" font-size="16" fill="#405a70">驱动</text><path d="M786 265H870" fill="none" stroke="#497899" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)"/><text x="800" y="246" font-size="16" fill="#405a70">网络</text>
<text x="38" y="466" font-size="19" fill="#405a70">拟人体验来自声音、字幕与表情；对话可由真实大模型生成。离线唤醒 ≠ 离线通用聊天。</text><text x="38" y="499" font-size="15" fill="#60788c">原创架构示意 / 基于固定源码静态研究 / 未进行硬件实测</text></g></svg>
